info:
  name: "2. Create Short URL"
  type: http
  seq: 2

http:
  method: post
  url: "{{baseUrl}}/short-url"
  headers:
    - name: X-API-Key
      value: "{{SERVICES_APIKEY}}"
    - name: x-api-version
      value: "1"
    - name: x-tenant-id
      value: "{{tenantId}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "url": "https://example.org/some/long/path?with=params"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create Short URL

  `POST /short-url` — get-or-create a short URL for `url` (absolute `http(s)`
  URL). Returns `{ "url": "<fully-qualified short URL>" }`.

  **Gateway permissions:** `POST` counts as a write, so your key needs the
  *write* permission for the tenant in `x-tenant-id`; otherwise
  `403 tenant_scope_denied`.
