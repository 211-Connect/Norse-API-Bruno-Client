info:
  name: "1. Forward Geocode"
  type: http
  seq: 1

http:
  method: get
  url: "{{baseUrl}}/geocoding/forward?address=123%20Main%20St%2C%20New%20York%2C%20NY&provider=mapbox&limit=5"
  headers:
    - name: X-API-Key
      value: "{{SERVICES_APIKEY}}"
    - name: x-api-version
      value: "1"
    - name: x-tenant-id
      value: "{{tenantId}}"
  params:
    - name: address
      value: "123 Main St, New York, NY"
      type: query
    - name: provider
      value: mapbox
      type: query
    - name: limit
      value: "5"
      type: query
    - name: types
      value: address,poi
      type: query
      disabled: true
    - name: proximity
      value: "-78.8986,35.994"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Forward Geocode

  `GET /geocoding/forward` — address → coordinates. `address` required;
  `provider` `mapbox`|`opencage` (default mapbox); `limit` 1–10 (default 5).

  Mapbox-only extras (enable the disabled params):

  - `types` — restrict result feature types, comma-separated or repeated:
    `country`, `region`, `postcode`, `district`, `place`, `locality`,
    `neighborhood`, `address`, `poi`. With `provider=opencage` this is a `400`.
  - `proximity` — bias results toward `"lng,lat"`. OpenCage ignores it.

  Each result carries `coordinates` as **`[lng, lat]`**, `place_type[]`, and
  (for area-like results) a `bbox` `[minLng, minLat, maxLng, maxLat]`.

  **Note:** not tenant-scoped in its data, but the gateway still requires the
  `x-tenant-id` header on this route (a tenant you hold a key for).
