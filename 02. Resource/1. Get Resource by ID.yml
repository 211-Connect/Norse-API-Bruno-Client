info:
  name: 1. Get Resource by ID
  type: http
  seq: 1

http:
  method: get
  url: "{{baseUrl}}/resource/:id"
  headers:
    - name: X-API-Key
      value: "{{SERVICES_APIKEY}}"
    - name: x-api-version
      value: "1"
    - name: x-tenant-id
      value: "{{tenantId}}"
    - name: accept-language
      value: "{{acceptLanguage}}"
  params:
    - name: id
      value: da4896f3-ba78-516f-b3f3-f376b320222c
      type: path
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Get Resource by ID

  `GET /resource/:id` — fetch a resource (one service at one location) by its
  `service_at_location_id` — the value from a search hit's
  `_source.service_at_location_id`, **not** `_source.id`. CDN-cached 15 min.

  Want the provider behind it? `GET /organization/service-at-location/:id`
  with the same id. Want the whole service across all its locations?
  `GET /service/:service_id`.
