info:
  name: "1. Get Suggestions"
  type: http
  seq: 1

http:
  method: get
  url: "{{baseUrl}}/suggestion?query=food&page=1"
  headers:
    - name: X-API-Key
      value: "{{SERVICES_APIKEY}}"
    - name: x-api-version
      value: "1"
    - name: x-tenant-id
      value: "{{tenantId}}"
    - name: accept-language
      value: "{{acceptLanguage}}"
  params:
    - name: query
      value: food
      type: query
    - name: page
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Suggestions

  `GET /suggestion` — combined typeahead in one round trip. `query` (≤500),
  `page` (≥1). Always returns both keys:

  ```jsonc
  {
    "taxonomies":    [ { "id": "…", "code": "BH-1800", "name": "Housing" } ],
    "organizations": [ { "organization_id": "…", "name": "Alpha Org", "city": "Chicago", "state": "IL" } ]
  }
  ```

  - `organizations` is populated only for tenants that have organization search
    enabled; otherwise it is `[]`. Organizations with no published resources are
    never suggested.
  - Feed `organization_id` to `GET /search?organization_id=…` to list or search
    within that organization.
  - Need only taxonomies, with pagination? Call `GET /taxonomy` directly.
