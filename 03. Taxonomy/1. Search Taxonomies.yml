info:
  name: "1. Search Taxonomies"
  type: http
  seq: 1

http:
  method: get
  url: "{{baseUrl}}/taxonomy?query=housing&page=1"
  headers:
    - name: X-API-Key
      value: "{{SERVICES_APIKEY}}"
    - name: x-api-version
      value: "1"
    - name: x-tenant-id
      value: "{{tenantId}}"
    - name: accept-language
      value: "{{acceptLanguage}}"
  params:
    - name: query
      value: housing
      type: query
    - name: page
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Search Taxonomies

  `GET /taxonomy` — prefix search by name/code. Returns
  `{ total, page, items: [{ id, code, name }] }`. `query` (≤500), `page` (≥1).

  **Version note:** this endpoint used to need `x-api-version: 2` for the slim
  `{ id, code, name }` shape. That shape is now what `x-api-version: 1` returns,
  and `2` no longer exists — send `1` like every other endpoint.
