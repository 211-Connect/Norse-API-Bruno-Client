info:
  name: "1. Search Taxonomies (v1)"
  type: http
  seq: 1

http:
  method: get
  url: "{{baseUrl}}/taxonomy?query=housing&page=1"
  headers:
    - name: X-API-Key
      value: "{{SERVICES_APIKEY}}"
    - name: x-api-version
      value: "1"
    - name: x-tenant-id
      value: "{{tenantId}}"
    - name: accept-language
      value: "{{acceptLanguage}}"
  params:
    - name: query
      value: housing
      type: query
    - name: page
      value: "1"
      type: query
    - name: code
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Search Taxonomies (v1)

  `GET /taxonomy` (`x-api-version: 1`) — prefix search by name/code, 10/page.
  Returns full ES hits. `query` (≤500), `page` (≥1). `code` is deprecated.
