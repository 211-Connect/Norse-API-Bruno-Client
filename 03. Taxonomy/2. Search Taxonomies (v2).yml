info:
  name: "2. Search Taxonomies (v2)"
  type: http
  seq: 2

http:
  method: get
  url: "{{baseUrl}}/taxonomy?query=housing&page=1"
  headers:
    - name: X-API-Key
      value: "{{SERVICES_APIKEY}}"
    - name: x-api-version
      value: "2"
    - name: x-tenant-id
      value: "{{tenantId}}"
    - name: accept-language
      value: "{{acceptLanguage}}"
  params:
    - name: query
      value: housing
      type: query
    - name: page
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Search Taxonomies (v2)

  `GET /taxonomy` with `x-api-version: 2` — same query params, but returns a
  simplified `{ id, name, code }` list.
