info:
  name: 1. Search Resources (GET)
  type: http
  seq: 1

http:
  method: get
  url: "{{baseUrl}}/search?query=legal aid&query_type=hybrid&page=1&limit=25&sort=relevance"
  headers:
    - name: X-API-Key
      value: "{{SERVICES_APIKEY}}"
    - name: x-api-version
      value: "1"
    - name: x-tenant-id
      value: "{{tenantId}}"
    - name: accept-language
      value: "{{acceptLanguage}}"
  params:
    - name: query
      value: legal aid
      type: query
    - name: query_type
      value: hybrid
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "25"
      type: query
    - name: sort
      value: relevance
      type: query
    - name: coords
      value: -120.740135,47.751076
      type: query
      disabled: true
    - name: distance
      value: "25"
      type: query
      disabled: true
    - name: taxonomy
      value: BM-1400,BM-1700
      type: query
      disabled: true
    - name: geo_type
      value: proximity
      type: query
      disabled: true
    - name: age
      value: "30"
      type: query
      disabled: true
    - name: organization_id
      value: ORGANIZATION_ID
      type: query
      disabled: true
    - name: relevance_cutoff
      value: "on"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Search Resources (GET)

  Primary resource search. Enable the disabled params (coords/distance/taxonomy/
  geo_type/age/organization_id/relevance_cutoff) as needed. `limit` must be
  25–300, and `page * limit` may not exceed 10,000 (with `limit=25` the last
  page is 400). For polygon/boundary search use **Search Resources (POST)**.

  - `organization_id` scopes results to one organization by the stable id that
    `GET /organization` and `GET /suggestion` return. It composes with any
    `query_type`; an empty `query` plus `organization_id` lists that
    organization's resources.
  - `relevance_cutoff` is opt-in and `off` by default — leave it disabled to get
    the full result set. The only other value is `on`. See requests 5 and 6.
